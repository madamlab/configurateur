
<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Helvetica Neue',sans-serif}
body{background:#fdf7f8;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px}
.hdr{width:100%;max-width:700px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-size:18px;font-weight:800;color:#3d1a20}
.sub{font-size:9px;color:#E8724A;font-weight:700;text-transform:uppercase;letter-spacing:.12em}
.ms{display:flex;gap:8px}
.mb{padding:6px 14px;border-radius:20px;cursor:pointer;font-size:11px;font-weight:700;border:1.5px solid #e0c8cc;background:#fff;color:#3d1a20}
.mb.on{background:#E8724A;color:#fff;border-color:#E8724A}
.main{display:flex;flex-wrap:wrap;gap:24px;width:100%;max-width:700px;align-items:flex-start;justify-content:center}
.lamp-card{background:#fff;border-radius:24px;border:1px solid #f0d0d5;padding:20px;box-shadow:0 2px 16px rgba(0,0,0,.05)}
.ctrl{flex:1 1 280px;display:flex;flex-direction:column;gap:14px}
.pb{background:#fff;border-radius:16px;border:1px solid #f0d0d5;padding:14px}
.pl{font-size:10px;font-weight:700;color:#3d1a20;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.pd{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.1);flex-shrink:0}
.sr{display:flex;flex-wrap:wrap;gap:7px}
.sw{display:flex;flex-direction:column;align-items:center;cursor:pointer;gap:3px}
.sc{width:32px;height:32px;border-radius:50%;border:2px solid transparent;transition:all .15s;position:relative}
.sc:hover{transform:scale(1.12)}
.sc.on{border:2.5px solid #3d1a20;box-shadow:0 0 0 2px #fff inset}
.sc.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#3d1a20;font-weight:900}
.sn{font-size:8px;color:#bbb;text-align:center;width:40px;line-height:1.2}
.sn.on{color:#3d1a20;font-weight:700}
.sm{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#fff;border-radius:14px;border:1px solid #f0d0d5}
.si{display:flex;align-items:center;gap:6px;flex:1}
.sdot{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.08)}
.sep{width:1px;height:24px;background:#f0d0d5}
.note{padding:10px 14px;background:#fff8e1;border-radius:12px;border:1px solid #ffe082;font-size:11px;color:#7a5800;line-height:1.5}
.back{display:block;padding:10px 20px;background:#3d1a20;color:#fff;border-radius:20px;font-size:12px;font-weight:700;text-decoration:none;text-align:center}
</style>
</head><body>

const cache={};
const loaded={};
Object.entries(SRC).forEach(([k,src])=>{
  const img=new Image();
  img.onload=()=>{cache[k]=img;loaded[k]=true;if(Object.keys(loaded).length===8)apply();};
  img.src=src;cache[k]=img;
});

let AC=C[0],PC=C[1],model='ice';
const cnv=document.getElementById('cnv');
const ctx=cnv.getContext('2d');
const W=cnv.width,H=cnv.height;

function colorize(shapeImg,r,g,b){
  const off=document.createElement('canvas');
  off.width=W;off.height=H;
  const c=off.getContext('2d');
  c.drawImage(shapeImg,0,0,W,H);
  const pd=c.getImageData(0,0,W,H);
  const d=pd.data;
  for(let i=0;i<d.length;i+=4){
    if(d[i+3]>10){
      const lum=d[i]/255;
      d[i]=Math.round(r*lum);
      d[i+1]=Math.round(g*lum);
      d[i+2]=Math.round(b*lum);
    }
  }
  c.putImageData(pd,0,0);
  return off;
}

function draw(){
  const pfx=model==='ice'?'ic':'wv';
  ctx.clearRect(0,0,W,H);
  ctx.drawImage(colorize(cache[pfx+'_ps'],PC.r,PC.g,PC.b),0,0);
  ctx.drawImage(cache[pfx+'_pt'],0,0,W,H);
  ctx.drawImage(colorize(cache[pfx+'_as'],AC.r,AC.g,AC.b),0,0);
  ctx.drawImage(cache[pfx+'_at'],0,0,W,H);
}

function pick(part,id){
  const c=C.find(x=>x.id===id);
  if(part==='a')AC=c;else PC=c;
  apply();
}

function apply(){
  document.getElementById('da').style.background=AC.hex;
  document.getElementById('na').textContent=AC.label;
  document.getElementById('sda').style.background=AC.hex;
  document.getElementById('sna').textContent=AC.label;
  document.getElementById('dp').style.background=PC.hex;
  document.getElementById('np').textContent=PC.label;
  document.getElementById('sdp').style.background=PC.hex;
  document.getElementById('snp').textContent=PC.label;
  buildRows();
  if(Object.keys(loaded).length===8)draw();
}

function buildRows(){
  ['a','p'].forEach(part=>{
    const cur=part==='a'?AC:PC;
    document.getElementById('r'+part).innerHTML=C.map(c=>{
      const on=c.id===cur.id;
      return `<div class="sw" onclick="pick('${part}','${c.id}')">
        <div class="sc${on?' on':''}" style="background:${c.hex};${c.border?'outline:1px solid #ccc':''}"></div>
        <div class="sn${on?' on':''}">${c.label}</div>
      </div>`;
    }).join('');
  });
}

function setM(m){
  model=m;
  document.querySelectorAll('.mb').forEach((b,i)=>b.classList.toggle('on',(i===0&&m==='ice')||(i===1&&m==='wavy')));
  if(Object.keys(loaded).length===8)draw();
}

apply();
</script></body></html>
